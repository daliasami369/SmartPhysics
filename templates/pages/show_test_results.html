<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>نتائج الطلاب</title>
</head>
<body>

<h1>{{ test.title }}</h1>

<table border="1">

<tr>
    <th>اسم الطالب</th>
    <th>الدرجة</th>
</tr>

{% for result in results %}

<tr>

<td>
{{ result.student.first_name }}
{{ result.student.second_name }}
</td>

<td>
{{ result.score }} / {{ test.total_marks }}
</td>

</tr>

{% empty %}

<tr>
<td colspan="2">
لا يوجد أي طالب حل الاختبار.
</td>
</tr>

{% endfor %}

</table>

</body>
</html>
